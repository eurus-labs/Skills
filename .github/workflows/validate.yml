name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 30
    # Pinned: on ubuntu-26.04, the PlantUML 1.2020 package cannot parse Graphviz
    # 14's version string, so `plantuml -version` exits 254 before any check runs.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # This repository ships standard-library-only Python that runs on a
        # stranger's machine with no install step. The floor proves the scripts
        # do not quietly depend on newer syntax; the ceiling catches deprecations.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # apt mirrors occasionally stall, and a stalled `apt-get update` otherwise
      # waits until the job is cancelled. Bound each attempt, retry, then fail.
      - name: PlantUML, so Diagram as Code rendering is exercised
        timeout-minutes: 10
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          updated=false
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get $apt_opts update -qq; then
              updated=true
              break
            fi
            echo "apt-get update failed (attempt $attempt of 3)"
            sleep 5
          done
          "$updated"
          sudo apt-get $apt_opts install -y -qq plantuml
          plantuml -version

      - name: Sphinx and MyST, so the build harness is actually exercised
        run: |
          # Without these, render_docs.py --check falls through to docutils or reports
          # `skipped`, and every acceptance case for the harness is a case nothing runs.
          # Installing Sphinx locally for the first time found three defects in merged
          # code within minutes, which is the argument for having it here.
          #
          # These are test-time dependencies only. The scripts stay standard-library
          # only. CI installs them so the shipped Sphinx integration is exercised.
          python3 -m pip install --quiet --disable-pip-version-check sphinx myst-parser sphinxcontrib-plantuml
          sphinx-build --version

      - name: python-pptx and Pillow, the named file-format requirement
        run: |
          # The one required third-party dependency (scripts.instructions.md, "Required
          # dependencies"). The scripts never install it; CI does, so wfslides.py is tested.
          python3 -m pip install --quiet --disable-pip-version-check python-pptx Pillow

      - name: Every script compiles
        run: python3 -m compileall -q tools shared plugins

      - name: Structural validation
        run: python3 tools/validate.py

      - name: No drift between shared/ and its materialized copies
        run: python3 tools/materialize.py --check

      - name: Detection script runs and is scoped
        run: |
          # Bare invocation against a fixture must succeed; confidence must not
          # be "none" for a scenario that plainly declares pytest.
          python3 shared/scripts/detect_stack.py fixtures/02-wrong-test

      - name: Every behavioural test
        run: |
          # Globbed rather than listed, so a new tools/test_*.py is covered the moment
          # it lands instead of the day someone remembers to edit this file. Each one is
          # stdlib-only and exits non-zero on failure.
          status=0
          for test in tools/test_*.py; do
            echo "== $test"
            python3 "$test" || status=1
          done
          exit $status

  # The VS Code extension (extensions/vscode/) is plain JavaScript with no dependency and no build step, so
  # the only thing to install is Node. Node 18 is the floor the extension's `engines.vscode` bundles; Node 22
  # is a current release. The tests also start the real eval engine, which is stdlib-only Python.
  extension:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Extension tests
        run: node --test extensions/vscode/test/

  # The one check the branch ruleset requires. Its name stays fixed when the matrix
  # above changes, so adding or dropping a Python version never strands the ruleset.
  # always(): without it a failed validate makes this job "skipped", and GitHub
  # counts a skipped required check as passing.
  verify:
    if: always()
    needs: [validate, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Every validate and extension job passed
        env:
          VALIDATE: ${{ needs.validate.result }}
          EXTENSION: ${{ needs.extension.result }}
        run: |
          echo "validate: $VALIDATE"
          echo "extension: $EXTENSION"
          test "$VALIDATE" = success
          test "$EXTENSION" = success
